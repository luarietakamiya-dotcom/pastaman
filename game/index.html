<style>
/* Layout: one-screen arcade cabinet — portrait canvas centered, HUD drawn in-canvas, special button floating bottom-right */
:root{
  --bg:#1a0f0c;         /* dark trattoria wood */

  --cheese:#f5c542;
  --basil:#3fae5a;

  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;max-height:100%}
canvas{display:block;width:100%;height:100%;border-radius:6px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;padding-block:20px;
  background:rgba(20,10,8,.86);text-align:center;padding-inline:20px;border-radius:6px;overflow-y:auto}
.overlay h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,52px);line-height:1.05;margin:0;
  color:var(--cheese);text-shadow:0 4px 0 var(--tomato),0 8px 18px rgba(0,0,0,.6);text-wrap:balance;letter-spacing:.02em}
.overlay p{margin:0;max-width:30ch;line-height:1.7;color:var(--ink);font-size:14px}
.overlay .small{color:var(--muted);font-size:12px}
.heroimg{height:min(26vh,200px);width:auto;max-width:100%;filter:drop-shadow(0 0 18px rgba(232,64,42,.6))}
.logoimg{width:min(78%,280px);height:auto;margin-top:-28px}
.sub{font-family:var(--display);font-size:20px!important;color:var(--ink)!important;letter-spacing:.3em;margin-top:-12px!important}
.entry{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:320px;width:100%}
.entry label{font-family:var(--display);color:var(--cheese);font-size:14px}
.entry input{flex:1 1 140px;min-width:0;font:500 16px var(--body);color:var(--bg);background:var(--ink);border:2px solid var(--cheese);border-radius:10px;padding:9px 12px;-webkit-user-select:text;user-select:text;touch-action:auto}
.entry input:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.btn.mini{font-size:15px;padding:10px 18px;box-shadow:0 4px 0 #b8862a}
.btn.ghost{background:transparent;color:var(--cheese);box-shadow:none;border:2px solid var(--cheese);font-size:15px;padding:8px 20px}
.btn:disabled{opacity:.5;cursor:default}
.rankbox{width:100%;max-width:320px;display:flex;flex-direction:column;gap:6px}
.rankbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink);letter-spacing:.08em}
#rankView{background:var(--bg)}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;min-width:0;font:800 12px var(--body);color:var(--muted);background:#2a1814;border:0;border-radius:8px;padding:7px 0;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--cheese);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rank{list-style:none;margin:0;padding:0;max-height:34vh;overflow-y:auto;border-top:1px solid #4a3028}

.rank li .n{font-family:var(--display);color:var(--muted);text-align:right}
.rank li:nth-child(1) .n{color:#ffd84a}.rank li:nth-child(2) .n{color:#d9d4cc}.rank li:nth-child(3) .n{color:#d08a4a}

.home{color:var(--muted);font-size:13px;text-decoration:none}
.home:hover,.home:focus-visible{color:var(--cheese)}

<div id="wrap"><div id="stage">

    <button class="btn" id="go">スタート</button>
    <p class="small">指でスライドしてお皿を動かす・タップで発射</p>
    <button class="btn ghost" id="showRank">ランキングを見る</button>
    <a class="home" href="../">← パスタマン公式HPへ</a>
  </div>
  <div class="overlay" id="over" hidden>
    <h1>ごちそう<br>さまでした</h1>
    <p id="result"></p>
    <form class="entry" id="entry">
      <label for="pname">名前</label>
      <input id="pname" maxlength="12" autocomplete="nickname" placeholder="パスタ好き" enterkeyhint="done">

    </form>
    <p class="small" id="entryMsg"></p>
    <div class="rankbox"><h2 class="rankTitle">ランキング</h2><div class="tabs" role="tablist" aria-label="ランキングの期間"><button type="button" role="tab" data-p="day">今日</button><button type="button" role="tab" data-p="week">週間</button><button type="button" role="tab" data-p="month">月間</button><button type="button" role="tab" data-p="year">年間</button><button type="button" role="tab" data-p="all">総合</button></div><ol class="rank" id="rankList"></ol></div>
    <button class="btn" id="again" type="button">もう一回</button>
  </div>
  <div class="overlay" id="rankView" hidden>
    <div class="rankbox"><h2 class="rankTitle">ランキング</h2><div class="tabs" role="tablist" aria-label="ランキングの期間"><button type="button" role="tab" data-p="day">今日</button><button type="button" role="tab" data-p="week">週間</button><button type="button" role="tab" data-p="month">月間</button><button type="button" role="tab" data-p="year">年間</button><button type="button" role="tab" data-p="all">総合</button></div><ol class="rank" id="rankList2"></ol></div>
    <button class="btn" id="closeRank" type="button">もどる</button>
  </div>
</div></div>

<script>
(()=>{
const W=360,H=640,COLS=30,CELL=12,TOP=72,ROWS=26,PY=496,BR=3.2,MAXB=1800;
const EMPTY=0,PASTA=1,HARD=2,MUSSEL=3,WALL=4;
const isBrk=v=>v>0&&v!==WALL;
let SPEED=270;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DISP=getComputedStyle(document.documentElement).getPropertyValue('--display');
const SP={"logo":[152,829,308,85],"hit":[197,422,144,200,68,137],"brick":[673,829,40,40],"stone":[715,829,40,40],"crack":[757,829,40,40],"ball":[0,919,24,23],"tomato":[518,829,50,56],"chili":[570,829,53,56],"cheese":[462,829,54,64],"mussel":[799,829,48,40],"boom":[331,634,93,128],"mentai":[849,829,56,38],"life":[625,829,46,48],"plate":[965,829,56,24],"plate0":[907,829,56,26],"getfx":[0,829,150,88],"lostfx":[426,634,150,99],"x2":[674,634,150,93],"x3":[826,634,150,89],"goldfx":[578,634,94,96],"idle0":[543,0,155,240,77,154],"idle1":[700,0,155,240,77,154],"idle2":[857,0,154,240,77,151],"idle3":[391,0,150,241,74,149],"idle4":[243,0,146,242,72,145],"run0":[161,634,168,192,94,146],"run1":[818,422,162,193,94,134],"run2":[502,422,162,195,92,137],"run3":[343,422,157,196,88,136],"run4":[666,422,150,195,81,136],"run5":[0,634,159,193,86,143],"storm":[0,422,195,210,96,81],"hero":[0,0,241,420],"mushroom":[0,944,64,55],"meat":[66,944,64,43],"basil":[132,944,64,45],"eggplant":[198,944,64,60],"jumpUp":[270,944,108,169,58,96],"jumpDown":[380,944,98,146,49,86],"ko":[480,944,112,129,58,75],"bHome":[594,944,96,68],"bPierce":[692,944,96,46],"bStrong":[790,944,96,73]};
const ATLAS=new Image();let atlasOK=false;
ATLAS.onload=()=>{atlasOK=true;buildTiles();fillTitle();};
ATLAS.src='atlas.webp';
let scale=1;

  cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);scale=cv.width/W;if(typeof buildTiles==='function')buildTiles();}
addEventListener('resize',resize);

// ---------- audio ----------
let ac=null,master=null,muted=false,blipBudget=0;
function initAudio(){ if(ac) return; try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);}catch(e){} }
function tone(f,dur=.08,type='square',vol=.05,when=0){ if(!ac||muted||!running) return; const t=ac.currentTime+when;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur=.4,vol=.25){ if(!ac||muted||!running) return; const t=ac.currentTime,n=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  s.buffer=buf;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
// ---- voice / BGM slots: put audio data URIs here when the files arrive ----
const VOICE_SRC='voice.mp3', BGM_SRC='../audio/main-theme.mp3';
const voiceEl=VOICE_SRC?new Audio(VOICE_SRC):null, bgmEl=BGM_SRC?new Audio(BGM_SRC):null;
if(bgmEl){bgmEl.loop=true;bgmEl.volume=.45;}
function shout(){ if(muted) return;
  if(voiceEl){ try{voiceEl.currentTime=0;voiceEl.play().catch(()=>{}); if(bgmEl){bgmEl.volume=.15;setTimeout(()=>{bgmEl.volume=.45;},1700);} }catch(e){} return; }
  try{ const u=new SpeechSynthesisUtterance('パスタトーレ！'); u.lang='ja-JP'; u.rate=1.15; u.pitch=1.3; u.volume=1; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function bgm(on){ if(!bgmEl) return; try{ if(on&&!muted) bgmEl.play().catch(()=>{}); else bgmEl.pause(); }catch(e){} }
const PENTA=[0,2,4,7,9];
function comboNote(n){const oct=Math.min(Math.floor(n/5),6),st=PENTA[n%5]+oct*12;return 330*Math.pow(2,st/12);}
function blip(n){ if(blipBudget<=0) return; blipBudget--; tone(comboNote(n),.07,'square',.035); }
function arp(base){[0,4,7,12,16].forEach((s,i)=>tone(base*Math.pow(2,s/12),.12,'triangle',.08,i*.045));}
function sweep(){ if(!ac||muted) return; const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(1760,t+.6);
  g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(g);g.connect(master);o.start(t);o.stop(t+1);
  [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.08,.5+i*.08));}

// ---------- state ----------
let grid,hp,tokens,balls,parts,texts,drops,remain,queue,booms;
let px=W/2,targetX=W/2,pw=84,onPad=true,score=0,lives=5,stageN=1,combo=0,comboT=0,maxCombo=0,gauge=0;
const GMAX=400;
let stormMax=1.4,fxs=[],pvx=0,ppx=W/2,runD=0,hitT=0,homT=0,basilT=0,nasuT=0,fireCD=0,pdown=false,frameN=0;
let shake=0,flash=0,flashCol='#fff',clearT=0,running=false,storm=0,feverT=0,t=0,cloneT=0,boomSnd=0;

const TOKEN_TYPES=['tomato','chili','cheese','mentai'];
function pickToken(n){const r=Math.random();
  if(r<.30) return 'tomato'; if(r<.43) return 'chili'; if(r<.58) return 'cheese'; if(r<.68) return 'mentai';
  if(r<.78) return 'mushroom'; if(r<.87) return 'meat'; if(r<.94) return 'basil'; return 'eggplant';}
// ---- 20 stage layouts: (c,r) -> 0 empty / 1 pasta / 2 hard / 3 mussel ----
const hsh=(c,r)=>{const x=Math.sin(c*12.9898+r*78.233)*43758.5453;return x-Math.floor(x);};
const FONT={P:['111','101','111','100','100'],A:['010','101','111','101','101'],S:['111','100','111','001','111'],T:['111','010','010','010','010']};
const LAYOUTS=[
  /* 1 はじめの一皿 */ (c,r)=> (r>=6&&r<=19)?1:0,
  /* 2 まんなかの柱 */ (c,r)=> (c>=13&&c<=16)?(r%5===0?1:2):1,
  /* 3 ハート */ (c,r)=>{const x=(c-14.5)/10,y=(r-11)/10,h=Math.pow(x*x+y*y-1,3)-x*x*Math.pow(-y,3);let v=h<0?1:(r>18?2:0);if(r===ROWS-1)v=2;if(v===2&&(c%6===2||c%6===3))v=1;return v;},
  /* 4 ななめストライプ */ (c,r)=> r<3?1:((c+r)%10<6?1:((c+r)%10===9?2:0)),
  /* 5 ピラミッド */ (c,r)=> (r>=3&&Math.abs(c-14.5)<(r-2)*.62)?(r===ROWS-1&&c%5!==2?2:1):0,
  /* 6 市松 */ (c,r)=> ((c/3|0)+(r/3|0))%2===0?1:(r%9===4&&c%3===1?2:0),
  /* 7 にっこり */ (c,r)=>{const cx=c-14.5,cy=r-12.5,d=Math.hypot(cx/1.15,cy);if(d>12)return 0;
      if(Math.hypot(cx+5,cy+4)<2.2||Math.hypot(cx-5,cy+4)<2.2)return 2;const y0=5-cx*cx/18;if(Math.abs(cx)<7&&cy>y0-1.4&&cy<y0+.4)return 0;return 1;},
  /* 8 たてじま */ (c,r)=> c%4<2?(r<2?2:1):0,
  /* 9 ミルフィーユ */ (c,r)=>{if(r<2)return 0;if(r%4===3){const o=((r>>2)%2)?2:7;return (c%10===o||c%10===o+1)?1:4;}return 1;},
  /* 10 ダイヤ */ (c,r)=>{const cx=c-14.5,cy=r-12.5,m=Math.abs(cx)/15+Math.abs(cy)/13;if(m>=1)return 0;
      if(m>.55&&m<.7)return (Math.abs(cx)<1.5||Math.abs(cy)<1)?1:2;return 1;},
  /* 11 ふたつの塔 */ (c,r)=> (c<10||c>19)?(r<3?2:1):(r>20?1:0),
  /* 12 なみなみ */ (c,r)=> (r>7+4*Math.sin(c*.42)&&r<19+3*Math.sin(c*.42+1.3))?1:0,
  /* 13 PASTA */ (c,r)=>{const li=Math.floor(c/6),lc=c%6;if(r>=ROWS-2)return c%6===2?1:2;
      if(lc===5)return 0;const rr=r-6;if(rr<0||rr>=10)return 0;const g=FONT['PASTA'[li]];return g[rr>>1][[0,0,1,2,2][lc]]==='1'?1:0;},
  /* 14 うずまき */ (c,r)=>{const cx=c-14.5,cy=r-12.5,d=Math.max(Math.abs(cx)/1.15,Math.abs(cy));if(d>12.5)return 0;
      let v=(Math.floor(d/2)%2)?2:1;if(v===2&&((Math.abs(cx)<1.5&&cy<0)||(Math.abs(cy)<1&&cx>0)))v=1;return v;},
  /* 15 トンネル */ (c,r)=> (c===9||c===10||c===19||c===20)?(r%4===0?1:4):1,
  /* 16 ジグザグ */ (c,r)=> r<1?2:((r+Math.abs((c%12)-6))%8<4?1:0),
  /* 17 ちらし */ (c,r)=>{const h=hsh(c,r);return h<.5?1:h<.6?2:0;},
  /* 18 とりで */ (c,r)=>{const cx=c-14.5,cy=r-12.5;if(Math.hypot(cx,cy)<2.6)return 3;
      if(c<2||c>27||r<2||r>23)return (r>23&&c>=12&&c<=17)||(r<2&&(c===7||c===22))?1:2;return 1;},
  /* 19 たれる麺 */ (c,r)=>{const len=8+Math.floor(hsh(c,0)*17);if(r<3)return c%5===0?1:2;return (c%2===0&&r<len)?1:0;},
  /* 20 鉄の迷路 */ (c,r)=>{if(r<1)return 0;if(r%5===0&&r<=20){const left=(r/5)%2===1;const gap=left?(c>=2&&c<=4):(c>=25&&c<=27);return gap?1:4;}return 1;},
  /* 21 鉄格子 */ (c,r)=> r<2?0:((c%5===2&&r>=4&&r<=21)?4:1),
  /* 22 じょうご */ (c,r)=>{if(r<8)return 1;if(r>22)return 0;const cx=c-14.5,w=3+(22-r)*.75,a=Math.abs(cx);if(Math.abs(a-w)<.8)return 4;return a<w?1:0;},

  tiles={brick:tile('brick',s),stone:tile('stone',s),stone1:tile('stone',s,.6),mussel:tile('mussel',s+2),ball:tile('ball',BR*2.3),
    wall:wallTile(CELL),mushroom:fitTile('mushroom',18),meat:fitTile('meat',18),basil:fitTile('basil',18),eggplant:fitTile('eggplant',18),meatS:fitTile('meat',7),tomato:tile('tomato',16),chili:tile('chili',16),cheese:tile('cheese',17),mentai:tile('mentai',17)};}
function spr(n,dx,dy,dw,dh){const m=SP[n];ctx.drawImage(ATLAS,m[0],m[1],m[2],m[3],dx,dy,dw,dh);}
function sprC(n,x,y,w){const m=SP[n];const h=w*m[3]/m[2];spr(n,x-w/2,y-h/2,w,h);}
function fx(n,x,y,w,life=.6,grow=.5){ if(fxs.length<24) fxs.push({n,x,y,w,life,max:life,grow}); }
function heroFrame(vx){
  if(hitT>0) return 'ko';
  if(storm>0) return storm>stormMax*.5?'jumpUp':'jumpDown';
  if(Math.abs(vx)>45) return 'run'+(Math.floor(runD/16)%6);
  const k=Math.floor(t*7)%8; return 'idle'+[0,1,2,3,4,3,2,1][k];
}
function drawHero(x,vx,clone){
  const n=heroFrame(vx),m=SP[n];
  const fixed=(n==='storm'||n==='hit'||n==='ko');
  const pcx=fixed?m[2]/2:m[4], pw0=fixed?m[2]*.82:m[5];
  const k=pw/pw0, w=m[2]*k, h=m[3]*k;
  const flip=n.startsWith('run')?vx>0:(clone);
  const jy=(n==='jumpUp'||n==='jumpDown')?-Math.sin(Math.PI*(1-storm/stormMax))*14:0;
  ctx.save();ctx.translate(x,PY-7+jy);if(flip)ctx.scale(-1,1);
  if(clone){ctx.shadowColor='#ff8fa3';ctx.shadowBlur=14;}
  ctx.drawImage(ATLAS,m[0],m[1],m[2],m[3],-pcx*k,0,w,h);
  ctx.restore();
}
function drawFallbackHero(x){ // before the sprite sheet decodes
  ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.ellipse(x,PY,pw/2,5,0,0,6.283);ctx.fill();
}
function draw(){
  const s=scale;ctx.setTransform(s,0,0,s,0,0);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.fillStyle='#1a0f0c';ctx.fillRect(0,0,W,H);
  ctx.translate(sx,sy);
  for(let y=PY+30;y<H;y+=16)for(let x=0;x<W;x+=16){ctx.fillStyle=((x+y)/16)%2?'#3a1814':'#2a1210';ctx.fillRect(x,y,16,16);}
  if(feverT>0){ctx.fillStyle=`rgba(232,64,42,${.12*feverT*(.6+.4*Math.sin(t*12))})`;ctx.fillRect(0,0,W,H);}
  ctx.strokeStyle='#4a3028';ctx.lineWidth=2;ctx.strokeRect(1,TOP-15,W-2,PY+30-TOP);
  // bricks
  const T=atlasOK&&tiles.brick;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const i=r*COLS+c,v=grid[i];if(!v)continue;
    const x=c*CELL+.5,y=TOP+r*CELL+.5;
    if(!T){ctx.fillStyle=v===PASTA?'#f2c14e':v===HARD?'#8c7f75':v===WALL?'#4b5a6e':'#1f2a44';ctx.fillRect(x,y,CELL-1,CELL-1);continue;}
    if(v===PASTA) ctx.drawImage(tiles.brick,x,y,CELL-1,CELL-1);
    else if(v===HARD) ctx.drawImage(hp[i]>=2?tiles.stone:tiles.stone1,x,y,CELL-1,CELL-1);
    else if(v===WALL) ctx.drawImage(tiles.wall,x-.5,y-.5,CELL,CELL);
    else { const l=hp[i],j=(3-l)*.8; const ox=l<3?(Math.random()-.5)*j:0;
      if(l<3){ctx.fillStyle=l===1?'rgba(255,90,40,.55)':'rgba(255,138,61,.3)';ctx.fillRect(x,y,CELL-1,CELL-1);}
      ctx.drawImage(tiles.mussel,x-1+ox,y-1,CELL+1,CELL+1); }
  }
  // tokens
  for(const tk of tokens){ if(!tk.alive) continue; const pr=1+Math.sin(t*5+tk.ph)*.12;
    const tl=T&&tiles[tk.type]; if(tl){const sz=16*pr;ctx.drawImage(tl,tk.x-sz/2,tk.y-sz/2,sz,sz);} else {ctx.fillStyle='#e8402a';ctx.beginPath();ctx.arc(tk.x,tk.y,6,0,6.283);ctx.fill();} }
  for(const d of drops){const tl=T&&tiles[d.type]; if(tl) ctx.drawImage(tl,d.x-9,d.y-9,18,18);}
  // additive effects layer (explosions, pickups)
  if(atlasOK){ ctx.globalCompositeOperation='lighter';
    for(const b of booms){const k=1-b.life/b.max;ctx.globalAlpha=1-k*k;sprC('boom',b.x,b.y,70+k*120);}
    for(const f of fxs){const k=1-f.life/f.max;ctx.globalAlpha=Math.min(1,(1-k)*1.6);sprC(f.n,f.x,f.y,f.w*(1+k*f.grow));}
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'; }
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.s,p.s);}
  ctx.globalAlpha=1;
  // balls
  const bs=BR*2.3;
  if(T){ for(const b of balls){ if(b.p>0) continue; ctx.drawImage(tiles.ball,b.x-bs/2,b.y-bs/2,bs,bs);} if(onPad&&running) ctx.drawImage(tiles.ball,px-bs/2,PY-9-bs/2,bs,bs); }
  else { ctx.fillStyle='#fff4e0';ctx.beginPath();for(const b of balls){if(b.p>0)continue;ctx.moveTo(b.x+BR,b.y);ctx.arc(b.x,b.y,BR,0,6.283);}ctx.fill(); }
  // piercing (chili) and homing (mushroom) balls: trail sprites aligned to motion
  let nsp=0;
  const trail=(n,b,len)=>{const m=SP[n],h=len*m[3]/m[2],a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
    ctx.drawImage(ATLAS,m[0],m[1],m[2],m[3],-len+BR*1.6,-h/2,len,h);ctx.restore();};
  if(atlasOK){ ctx.globalCompositeOperation='lighter';
    for(const b of balls){ if(b.p>0&&nsp++<250) trail('bPierce',b,30); else if(homT>0&&b.p<=0&&nsp++<250) trail('bHome',b,20); }
    ctx.globalCompositeOperation='source-over'; }
  ctx.fillStyle=atlasOK?'#fff4e0':'#ff3b1f';ctx.beginPath();
  for(const b of balls){ if(b.p<=0) continue; ctx.moveTo(b.x+BR+.6,b.y);ctx.arc(b.x,b.y,BR+.6,0,6.283);} ctx.fill();
  // meat satellites
  if(T&&tiles.meatS){ for(const b of balls){ if(b.o===undefined) continue; const ox=b.x+Math.cos(b.o)*11,oy=b.y+Math.sin(b.o)*11; ctx.drawImage(tiles.meatS,ox-3.5,oy-3.5,7,7);} }
  else { ctx.fillStyle='#c8683a';ctx.beginPath();
  for(const b of balls){ if(b.o===undefined) continue; const ox=b.x+Math.cos(b.o)*11,oy=b.y+Math.sin(b.o)*11; ctx.moveTo(ox+2.8,oy);ctx.arc(ox,oy,2.8,0,6.283);} ctx.fill(); }
  if(homT>0&&balls.length>250){ ctx.strokeStyle='rgba(127,211,107,.5)';ctx.lineWidth=1;ctx.beginPath(); let k=0;
    for(const b of balls){ if(b.p>0||++k<250||k>650) continue; ctx.moveTo(b.x+BR+1.5,b.y);ctx.arc(b.x,b.y,BR+1.5,0,6.283);} ctx.stroke(); }
  if(nasuT>0&&!(nasuT<2.5&&Math.floor(t*8)%2)){ const y=PY+31; ctx.fillStyle='rgba(176,124,224,.25)';ctx.fillRect(0,y-3,W,8);
    ctx.fillStyle='#7d45b0';ctx.fillRect(0,y,W,3);ctx.fillStyle='#d7b6f2';ctx.fillRect(0,y,W,1);
    if(T&&tiles.eggplant){ for(let x=10;x<W;x+=60) ctx.drawImage(tiles.eggplant,x,y-7,14,14);} }
  // heroes
  if(atlasOK){
    if(cloneT>0){ const blink=cloneT<3&&Math.floor(t*8)%2; if(!blink){ctx.globalAlpha=.95;drawHero(W-px,-pvx,true);ctx.globalAlpha=1;} }
    drawHero(px,pvx,false);
  } else { drawFallbackHero(px); if(cloneT>0) drawFallbackHero(W-px); }
  // HUD
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.font='19px '+DISP;ctx.lineWidth=4;ctx.strokeStyle='#5a1a0c';ctx.strokeText(score.toLocaleString(),10,28);ctx.fillStyle='#ffd84a';ctx.fillText(score.toLocaleString(),10,28);
  ctx.font='11px '+DISP;ctx.fillStyle='#fff4e0';ctx.fillText(stageLabel(stageN)+'   ボール '+balls.length,10,46);
  if(atlasOK){ sprC('life',W-50,24,24); } 
  ctx.textAlign='right';ctx.font='17px '+DISP;ctx.strokeStyle='#5a1a0c';ctx.strokeText('×'+lives,W-10,31);ctx.fillStyle='#ffd84a';ctx.fillText('×'+lives,W-10,31);
  let hy=50;
  if(feverT>.5){ctx.fillStyle=`rgba(245,197,66,${.6+.4*Math.sin(t*14)})`;ctx.font='13px '+DISP;ctx.fillText('FEVER!!',W-10,hy);hy+=15;}
  ctx.font='11px '+DISP;
  for(const [v,lab,col] of [[cloneT,'分身','#ff8fa3'],[homT,'ホーミング','#7fd36b'],[basilT,'バジル連射','#5fd35a'],[nasuT,'なすびガード','#b07ce0']])
    if(v>0){ctx.fillStyle=col;ctx.fillText(lab+' '+Math.ceil(v),W-10,hy);hy+=14;}
  if(combo>=5){const sz=Math.min(26,13+combo/10);ctx.textAlign='center';ctx.font=sz+'px '+DISP;
    ctx.lineWidth=5;ctx.strokeStyle='#1a0f0c';ctx.globalAlpha=.9;ctx.strokeText(combo+' COMBO',W/2,PY-62);ctx.fillStyle='#f5c542';ctx.fillText(combo+' COMBO',W/2,PY-62);ctx.globalAlpha=1;}
  ctx.textAlign='center';
  for(const x of texts){const a=Math.min(1,x.life/x.max*3);ctx.globalAlpha=a;
    const sc=x.big?1+Math.max(0,(x.life-x.max+.15))*4:1;ctx.font=(x.size*sc)+'px '+DISP;
    if(x.big){ctx.lineWidth=6;ctx.strokeStyle='#1a0f0c';ctx.strokeText(x.s,x.x,x.y);}
    ctx.fillStyle=x.col;ctx.fillText(x.s,x.x,x.y);}
  ctx.globalAlpha=1;
  if(basilT>0&&!onPad&&running){ctx.textAlign='center';ctx.fillStyle=`rgba(95,211,90,${.6+.4*Math.sin(t*10)})`;ctx.font='12px '+DISP;ctx.fillText('長押しで連射！',W/2,PY-34);}
  if(onPad&&running&&clearT===0){ctx.fillStyle=`rgba(255,244,224,${.5+.5*Math.sin(t*5)})`;ctx.font='13px '+DISP;ctx.fillText('タップで発射！',W/2,PY-34);}
  ctx.setTransform(s,0,0,s,0,0);
  if(flash>0){ctx.globalAlpha=flash*.55;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
function fillTitle(){
  for(const [id,n] of [['logoC','logo'],['heroC','hero']]){const c=document.getElementById(id);if(!c)continue;const m=SP[n];
    c.width=m[2];c.height=m[3];c.getContext('2d').drawImage(ATLAS,m[0],m[1],m[2],m[3],0,0,m[2],m[3]);c.hidden=false;}
  const h=document.getElementById('titleText'); if(h) h.hidden=true;
  const st=document.getElementById('subT'); if(st) st.hidden=false;
}

// ---------- loop & input ----------
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(running)update(dt);draw();requestAnimationFrame(frame);}
function toLogical(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',e=>{targetX=toLogical(e);pdown=true;launch();});
for(const ev of ['pointerup','pointercancel','blur']) addEventListener(ev,()=>{pdown=false;});
cv.addEventListener('pointermove',e=>{targetX=toLogical(e);});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')targetX=px-40;if(e.key==='ArrowRight')targetX=px+40;if(e.key===' ')launch();if(e.key==='z'||e.key==='Z')special();});
document.getElementById('sp').addEventListener('click',special);
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'音 OFF':'音 ON';bgm(running);});
function start(){initAudio();if(ac&&ac.state==='suspended')ac.resume();document.getElementById('title').hidden=true;document.getElementById('over').hidden=true;reset();running=true;bgm(true);}

// ---------- ranking ----------
// Shared ranking runs through a Google Apps Script web app (see gas/ranking.gs).
// Until its URL is set in game/config.js, scores stay in this browser only.
const RANK_URL=(window.PASTAMAN_RANKING_URL||'').trim();
const LS_NAME='pastaman.name',LS_LOCAL='pastaman.localRank',LS_KEY='pastaman.player';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function playerKey(){let k=lsGet(LS_KEY);if(!k||!/^[A-Za-z0-9-]{8,64}$/.test(k)){k=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12));lsSet(LS_KEY,k);}return k;}
let boards=null,mine=null,shared=false,lastRun=null,submitted=false,localMark=null,period='day';
const PNAME={day:'今日',week:'週間',month:'月間',year:'年間',all:'総合'};
function periodStart(p){const J=9*3600e3,D=864e5,j=new Date(Date.now()+J),y=j.getUTCFullYear(),m=j.getUTCMonth(),d=j.getUTCDate();
  const day=Date.UTC(y,m,d)-J;return {day,week:day-((j.getUTCDay()+6)%7)*D,month:Date.UTC(y,m,1)-J,year:Date.UTC(y,0,1)-J,all:0}[p];}
function localRank(){try{return JSON.parse(lsGet(LS_LOCAL)||'[]');}catch(e){return [];}}
function saveLocal(en){const a=localRank();a.push(en);a.sort((x,y)=>y.score-x.score);lsSet(LS_LOCAL,JSON.stringify(a.slice(0,200)));localMark=en.at;}
function renderRank(){
  const rows=shared&&boards?(boards[period]||[]):localRank().filter(r=>(r.at||0)>=periodStart(period)).slice(0,50);
  document.querySelectorAll('.rankTitle').forEach(h=>h.textContent=(shared?'みんなの':'この端末の')+PNAME[period]+'ランキング');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===period)));
  for(const id of ['rankList','rankList2']){const ol=document.getElementById(id);ol.textContent='';
    if(!rows.length){const li=document.createElement('li');li.className='empty';li.textContent=PNAME[period]+'はまだ誰もいないよ。一番乗りしよう！';ol.appendChild(li);continue;}
    rows.forEach((r,i)=>{const li=document.createElement('li');
      if(shared?r.me:r.at===localMark) li.className='me';
      const n=document.createElement('span');n.className='n';n.textContent=(i+1);
      const nm=document.createElement('span');nm.className='nm';nm.textContent=String(r.name||'名無しのパスタ');
      const sc=document.createElement('span');sc.className='sc';sc.textContent=Number(r.score||0).toLocaleString();
      li.append(n,nm,sc);ol.appendChild(li);});}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{period=b.dataset.p;renderRank();}));
function applyServer(j){ if(j&&j.ok&&j.boards){boards=j.boards;mine=j.mine||null;shared=true;return true;} return false; }
async function fetchRank(){
  if(!RANK_URL){renderRank();return;}
  try{const r=await fetch(RANK_URL+'?key='+encodeURIComponent(playerKey()));const j=await r.json();
    applyServer(j);}catch(e){shared=false;}
  renderRank();
}
function onGameOver(){
  lastRun={score,stage:stageN,combo:maxCombo};submitted=false;
  const inp=document.getElementById('pname');inp.value=lsGet(LS_NAME)||'';
  const b=document.getElementById('submitBtn');b.disabled=false;b.textContent='登録';
  document.getElementById('entryMsg').textContent=lsGet(LS_NAME)?'前に使った名前を入れておいたよ':'名前を入れてランキングに登録しよう';
  fetchRank();
}
document.getElementById('entry').addEventListener('submit',async e=>{
  e.preventDefault(); if(!lastRun||submitted) return;
  const msg=t=>document.getElementById('entryMsg').textContent=t, b=document.getElementById('submitBtn');
  const name=(document.getElementById('pname').value.trim()||'名無しのパスタ').slice(0,12);
  lsSet(LS_NAME,name); submitted=true; b.disabled=true; b.textContent='登録中…';
  document.getElementById('pname').blur();
  const en={name,score:lastRun.score,stage:lastRun.stage,combo:lastRun.combo,at:Date.now()};
  if(RANK_URL){
    try{
      const r=await fetch(RANK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:playerKey(),name,score:en.score,stage:en.stage,combo:en.combo})});
      const j=await r.json();
      if(!j||!j.ok) throw new Error(j&&j.error||'error');
      applyServer(j);
      const m=j.mine||{},parts=[];
      for(const p of ['day','week','month','year','all']) if(m[p]&&m[p].rank) parts.push(PNAME[p]+' '+m[p].rank+'位');
      msg((j.improved?'自己ベスト更新！ ':'登録したよ！ ')+parts.join(' ／ '));
      b.textContent='登録済み';renderRank();return;
    }catch(err){ saveLocal(en); shared=false; msg('通信できなかったので、この端末のランキングに保存したよ'); b.textContent='保存済み'; renderRank(); return; }
  }
  saveLocal(en); msg('この端末のランキングに保存したよ'); b.textContent='保存済み'; renderRank();
});
document.getElementById('showRank').addEventListener('click',()=>{fetchRank();document.getElementById('rankView').hidden=false;});
document.getElementById('closeRank').addEventListener('click',()=>{document.getElementById('rankView').hidden=true;});
fetchRank();
if(location.hash==='#ranking'){document.getElementById('rankView').hidden=false;}

document.getElementById('go').addEventListener('click',start);
document.getElementById('again').addEventListener('click',start);
resize();stageGen(1);balls=[];parts=[];texts=[];drops=[];
for(let k=0;k<40;k++)addBall(Math.random()*W,PY-60-Math.random()*100,-Math.PI/2+(Math.random()-.5)*2);
const attract=()=>{ if(running) return; update(1/60); if(balls.length<20) for(let k=0;k<20;k++)addBall(px,PY-20,-Math.PI/2+(Math.random()-.5)*2); };
setInterval(attract,16);
requestAnimationFrame(frame);
})();
</script>
